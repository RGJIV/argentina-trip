<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Argentina Trip</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Argentina">
<meta name="theme-color" content="#f4f7f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-32.png">
<style>
  :root { --bg: #f4f7f7; --fg: #13232b; --muted: #5b6b72; --line: #cfd9dc; --accent: #1c3f8f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e171b; --fg: #e6eef0; --muted: #9db0b6; --line: #2a3a40; --accent: #8fb0ff; } }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .lock { min-height: 100vh; display: grid; place-content: center; gap: 14px; padding: 24px 16px; text-align: center; max-width: 360px; margin: 0 auto; }
  .lock img { width: 140px; height: 140px; border-radius: 28px; justify-self: center; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: .02em; }
  p { margin: 0; color: var(--muted); font-size: .92rem; }
  input { font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--fg); text-align: center; }
  button { font: 600 1rem/1 inherit; padding: 13px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; }
  .err { color: #c0392b; min-height: 1.4em; }
  .busy { color: var(--muted); }
</style>
</head>
<body>
<main class="lock" id="lock" hidden>
  <img src="icons/icon-512.png" alt="">
  <h1>Argentina Trip 2026</h1>
  <p>Type the passphrase once on this phone. After that the trip opens by itself, even with no service.</p>
  <form id="f">
    <div style="display:grid;gap:10px">
      <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Passphrase" aria-label="Passphrase">
      <button type="submit">Open</button>
    </div>
  </form>
  <p class="err" id="err" aria-live="polite"></p>
</main>
<main class="lock busy" id="busy"><p>Opening…</p></main>
<script>
(function () {
  var KEY = "trip-key-v1";
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function ub64(buf) { var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  var pack = fetch("trip.enc", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error("load"); return r.json(); })
    .catch(function () { return caches.match("trip.enc", { ignoreSearch: true }).then(function (r) { if (!r) throw new Error("offline"); return r.json(); }); });
  function open(rawKey) {
    return Promise.all([pack, crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"])]).then(function (a) {
      var p = a[0];
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(p.iv) }, a[1], b64(p.data));
    }).then(function (plain) { return new TextDecoder().decode(plain); });
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  function derive(pw) {
    return pack.then(function (p) {
      return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]).then(function (k) {
        return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(p.salt), iterations: p.iter }, k, 256);
      });
    });
  }
  function showLock(msg) {
    document.getElementById("busy").hidden = true;
    document.getElementById("lock").hidden = false;
    document.getElementById("err").textContent = msg || "";
  }
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) open(b64(saved)).then(show).catch(function () { showLock(navigator.onLine ? "Please type the passphrase again." : "Couldn't open the saved copy. Connect once and try again."); });
  else showLock();
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = document.getElementById("pw").value.trim().toLowerCase();
    if (!pw) return;
    document.getElementById("err").textContent = "Checking…";
    derive(pw).then(function (bits) {
      return open(bits).then(function (html) { try { localStorage.setItem(KEY, ub64(bits)); } catch (e) {} show(html); });
    }).catch(function () { document.getElementById("err").textContent = "That passphrase didn't work. Check the spelling and dashes."; });
  });
})();
</script>
</body>
</html>
